[supervisord]
nodaemon=true
user=root

[program:mariadb]
command=/usr/local/bin/docker-entrypoint.sh mariadbd
priority=10
autorestart=true
startsecs=5

[program:zabbix-agent2]
command=zabbix_agent2 -c /etc/zabbix/zabbix_agent2.conf
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
